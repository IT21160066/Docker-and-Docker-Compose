<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .container {
        margin: 40px auto;
        width: 80%;
      }
      hr {
        width: 400px;
        margin-left: 0;
      }
      h3 {
        display: inline-block;
      }
      #static {
        color: red;
      }
      #dynamic {
        color: green;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const response = await fetch("http://localhost:3000/fetch-data");
        const { data } = await response.json();
        document.getElementById("dynamic").textContent = data;
      });
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Welcome</h1>
      <span>Some static data: </span>
      <h3 id="static">this is hard-coded in index.html</h3>
      <hr />
      <span>Data from MongoDB: </span>
      <h3 id="dynamic"></h3>
      <hr />
    </div>
  </body>
</html>
